schema_version = 1

# One native host tool bundle is shared by all targets in that host profile.
# Linux FFI bridges additionally need glibc and musl variants within the bundle.

[hosts.linux_x86_64]
os = "linux"
arch = "x86_64"
runner = "ubuntu-24.04"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.linux_aarch64]
os = "linux"
arch = "aarch64"
runner = "ubuntu-24.04-arm"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.linux_riscv64]
os = "linux"
arch = "riscv64"
runner = "cross-built-on-linux-x64-or-arm64"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.macos_aarch64]
os = "macos"
arch = "aarch64"
runner = "macos-15"
native_tools = "macho"
ffi_abis = ["darwin"]

[hosts.windows_x86_64]
os = "windows"
arch = "x86_64"
runner = "windows-2025"
native_tools = "pe-coff"
ffi_abis = ["windows"]

[hosts.windows_aarch64]
os = "windows"
arch = "aarch64"
runner = "windows-11-arm"
native_tools = "pe-coff"
ffi_abis = ["windows"]

[targets.linux_x86_64_musl]
os = "linux"
arch = "x86_64"
abi = "musl"
llvm_triple = "x86_64-unknown-linux-musl"
status = "source-build-required"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "LLD ELF support"]

[targets.linux_aarch64_musl]
os = "linux"
arch = "aarch64"
abi = "musl"
llvm_triple = "aarch64-unknown-linux-musl"
status = "source-build-required"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "LLD ELF support"]

[targets.linux_riscv64_musl]
os = "linux"
arch = "riscv64"
abi = "musl"
llvm_triple = "riscv64-unknown-linux-musl"
status = "source-build-required"
isa_abi_baseline = "must-be-pinned (for example rv64gc/lp64d)"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "RISC-V ISA/ABI baseline", "LLD ELF support"]

[targets.windows_x86_64_msvc]
os = "windows"
arch = "x86_64"
abi = "msvc"
llvm_triple = "x86_64-pc-windows-msvc"
status = "redistribution-review-required"
provision_from = ["https://developer.microsoft.com/windows/downloads/windows-sdk/", "https://visualstudio.microsoft.com/downloads/", "https://github.com/llvm/llvm-project"]
requires = ["Windows SDK headers/import libraries", "UCRT headers/libraries", "VCRuntime headers/libraries or an explicitly chosen static CRT", "compiler-rt builtins", "LLD COFF support"]
fallback_target = "windows_x86_64_mingw_ucrt"

[targets.windows_aarch64_msvc]
os = "windows"
arch = "aarch64"
abi = "msvc"
llvm_triple = "aarch64-pc-windows-msvc"
status = "redistribution-review-required"
provision_from = ["https://developer.microsoft.com/windows/downloads/windows-sdk/", "https://visualstudio.microsoft.com/downloads/", "https://github.com/llvm/llvm-project"]
requires = ["Windows ARM64 SDK headers/import libraries", "UCRT headers/libraries", "VCRuntime ARM64 headers/libraries or an explicitly chosen static CRT", "compiler-rt builtins", "LLD COFF support"]
fallback_target = "windows_aarch64_mingw_ucrt"

[targets.macos_aarch64_darwin]
os = "macos"
arch = "aarch64"
abi = "darwin"
llvm_triple_form = "arm64-apple-macosx<minimum-version>"
status = "sdk-redistribution-gate"
provision_from = ["Xcode/macOS SDK on GitHub macOS runner (CI-only pending rights review)", "https://github.com/llvm/llvm-project"]
requires = ["macOS SDK headers", "libSystem .tbd link stubs", "deployment target", "LLD Mach-O support"]

[fallback_targets.windows_x86_64_mingw_ucrt]
os = "windows"
arch = "x86_64"
abi = "gnu-windows"
llvm_triple_form = "x86_64-w64-windows-gnu"
crt = "ucrt"
status = "fallback-if-msvc-redistribution-blocked"
provision_from = ["https://github.com/mstorsjo/llvm-mingw"]
requires = ["mingw-w64 headers", "UCRT libraries", "startup objects", "compiler-rt builtins", "LLD COFF support"]

[fallback_targets.windows_aarch64_mingw_ucrt]
os = "windows"
arch = "aarch64"
abi = "gnu-windows"
llvm_triple_form = "aarch64-w64-windows-gnu"
crt = "ucrt"
status = "fallback-if-msvc-redistribution-blocked"
provision_from = ["https://github.com/mstorsjo/llvm-mingw"]
requires = ["mingw-w64 headers", "UCRT libraries", "startup objects", "compiler-rt builtins", "LLD COFF support"]

# Explicit valid Cartesian product: 6 hosts × 6 target profiles.
[matrix]
pairs = [
  { host = "linux_x86_64", target = "linux_x86_64_musl" },
  { host = "linux_x86_64", target = "linux_aarch64_musl" },
  { host = "linux_x86_64", target = "linux_riscv64_musl" },
  { host = "linux_x86_64", target = "windows_x86_64_msvc" },
  { host = "linux_x86_64", target = "windows_aarch64_msvc" },
  { host = "linux_x86_64", target = "macos_aarch64_darwin" },
  { host = "linux_aarch64", target = "linux_x86_64_musl" },
  { host = "linux_aarch64", target = "linux_aarch64_musl" },
  { host = "linux_aarch64", target = "linux_riscv64_musl" },
  { host = "linux_aarch64", target = "windows_x86_64_msvc" },
  { host = "linux_aarch64", target = "windows_aarch64_msvc" },
  { host = "linux_aarch64", target = "macos_aarch64_darwin" },
  { host = "linux_riscv64", target = "linux_x86_64_musl" },
  { host = "linux_riscv64", target = "linux_aarch64_musl" },
  { host = "linux_riscv64", target = "linux_riscv64_musl" },
  { host = "linux_riscv64", target = "windows_x86_64_msvc" },
  { host = "linux_riscv64", target = "windows_aarch64_msvc" },
  { host = "linux_riscv64", target = "macos_aarch64_darwin" },
  { host = "macos_aarch64", target = "linux_x86_64_musl" },
  { host = "macos_aarch64", target = "linux_aarch64_musl" },
  { host = "macos_aarch64", target = "linux_riscv64_musl" },
  { host = "macos_aarch64", target = "windows_x86_64_msvc" },
  { host = "macos_aarch64", target = "windows_aarch64_msvc" },
  { host = "macos_aarch64", target = "macos_aarch64_darwin" },
  { host = "windows_x86_64", target = "linux_x86_64_musl" },
  { host = "windows_x86_64", target = "linux_aarch64_musl" },
  { host = "windows_x86_64", target = "linux_riscv64_musl" },
  { host = "windows_x86_64", target = "windows_x86_64_msvc" },
  { host = "windows_x86_64", target = "windows_aarch64_msvc" },
  { host = "windows_x86_64", target = "macos_aarch64_darwin" },
  { host = "windows_aarch64", target = "linux_x86_64_musl" },
  { host = "windows_aarch64", target = "linux_aarch64_musl" },
  { host = "windows_aarch64", target = "linux_riscv64_musl" },
  { host = "windows_aarch64", target = "windows_x86_64_msvc" },
  { host = "windows_aarch64", target = "windows_aarch64_msvc" },
  { host = "windows_aarch64", target = "macos_aarch64_darwin" },
]
