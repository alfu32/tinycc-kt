schema_version = 1

# One native host tool bundle is shared by all targets in that host profile.
# Linux FFI bridges additionally need glibc and musl variants within the bundle.

[hosts.linux_x86_64]
os = "linux"
arch = "x86_64"
runner = "ubuntu-24.04"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.linux_aarch64]
os = "linux"
arch = "aarch64"
runner = "ubuntu-24.04-arm"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.linux_riscv64]
os = "linux"
arch = "riscv64"
runner = "cross-built-on-linux-x64-or-arm64"
native_tools = "static-musl"
ffi_abis = ["glibc", "musl"]

[hosts.macos_aarch64]
os = "macos"
arch = "aarch64"
runner = "macos-15"
native_tools = "macho"
ffi_abis = ["darwin"]

[hosts.windows_x86_64]
os = "windows"
arch = "x86_64"
runner = "windows-2025"
native_tools = "pe-coff"
ffi_abis = ["windows"]

[hosts.windows_aarch64]
os = "windows"
arch = "aarch64"
runner = "windows-11-arm"
native_tools = "pe-coff"
ffi_abis = ["windows"]

[targets.linux_x86_64_musl]
os = "linux"
arch = "x86_64"
abi = "musl"
llvm_triple = "x86_64-unknown-linux-musl"
status = "source-build-required"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "LLD ELF support"]

[targets.linux_aarch64_musl]
os = "linux"
arch = "aarch64"
abi = "musl"
llvm_triple = "aarch64-unknown-linux-musl"
status = "source-build-required"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "LLD ELF support"]

[targets.linux_riscv64_musl]
os = "linux"
arch = "riscv64"
abi = "musl"
llvm_triple = "riscv64-unknown-linux-musl"
status = "source-build-required"
isa_abi_baseline = "must-be-pinned (for example rv64gc/lp64d)"
provision_from = ["https://git.musl-libc.org/cgit/musl/", "https://github.com/llvm/llvm-project"]
requires = ["musl headers", "musl libc", "crt startup objects", "compiler-rt builtins", "RISC-V ISA/ABI baseline", "LLD ELF support"]

[targets.windows_x86_64_mingw_ucrt]
os = "windows"
arch = "x86_64"
abi = "gnu-windows"
llvm_triple = "x86_64-w64-windows-gnu"
crt = "ucrt"
minimum_os = "Windows 10"
status = "source-build-required"
provision_from = ["https://github.com/mstorsjo/llvm-mingw", "https://github.com/llvm/llvm-project"]
requires = ["mingw-w64 headers", "UCRT import libraries", "CRT startup objects", "compiler-rt builtins", "LLD COFF support"]

[targets.windows_aarch64_mingw_ucrt]
os = "windows"
arch = "aarch64"
abi = "gnu-windows"
llvm_triple = "aarch64-w64-windows-gnu"
crt = "ucrt"
minimum_os = "Windows 10"
status = "source-build-required"
provision_from = ["https://github.com/mstorsjo/llvm-mingw", "https://github.com/llvm/llvm-project"]
requires = ["mingw-w64 headers", "UCRT import libraries", "CRT startup objects", "compiler-rt builtins", "LLD COFF support"]

[targets.macos_aarch64_darwin]
os = "macos"
arch = "aarch64"
abi = "darwin"
llvm_triple_form = "arm64-apple-macosx<minimum-version>"
status = "external-sdk-required"
allowed_hosts = ["macos_aarch64"]
sdk_distribution = "not-redistributable"
provision_from = ["Apple Command Line Tools or Xcode on macOS (user/runner supplied)", "https://github.com/llvm/llvm-project"]
requires = ["locally supplied macOS SDK headers", "libSystem .tbd link stubs", "deployment target", "LLD Mach-O support"]

[deferred_targets.windows_x86_64_msvc]
os = "windows"
arch = "x86_64"
abi = "msvc"
llvm_triple = "x86_64-pc-windows-msvc"
status = "deferred-redistribution-review"
requires = ["Windows SDK headers/import libraries", "UCRT headers/libraries", "VCRuntime headers/libraries", "compiler-rt builtins", "LLD COFF support"]

[deferred_targets.windows_aarch64_msvc]
os = "windows"
arch = "aarch64"
abi = "msvc"
llvm_triple = "aarch64-pc-windows-msvc"
status = "deferred-redistribution-review"
requires = ["Windows ARM64 SDK headers/import libraries", "UCRT headers/libraries", "VCRuntime ARM64 headers/libraries", "compiler-rt builtins", "LLD COFF support"]

# Explicit valid pair matrix: 30 Linux/Windows target pairs plus the native macOS-to-Darwin pair.
[matrix]
pairs = [
  { host = "linux_x86_64", target = "linux_x86_64_musl" },
  { host = "linux_x86_64", target = "linux_aarch64_musl" },
  { host = "linux_x86_64", target = "linux_riscv64_musl" },
  { host = "linux_x86_64", target = "windows_x86_64_mingw_ucrt" },
  { host = "linux_x86_64", target = "windows_aarch64_mingw_ucrt" },
  { host = "linux_aarch64", target = "linux_x86_64_musl" },
  { host = "linux_aarch64", target = "linux_aarch64_musl" },
  { host = "linux_aarch64", target = "linux_riscv64_musl" },
  { host = "linux_aarch64", target = "windows_x86_64_mingw_ucrt" },
  { host = "linux_aarch64", target = "windows_aarch64_mingw_ucrt" },
  { host = "linux_riscv64", target = "linux_x86_64_musl" },
  { host = "linux_riscv64", target = "linux_aarch64_musl" },
  { host = "linux_riscv64", target = "linux_riscv64_musl" },
  { host = "linux_riscv64", target = "windows_x86_64_mingw_ucrt" },
  { host = "linux_riscv64", target = "windows_aarch64_mingw_ucrt" },
  { host = "macos_aarch64", target = "linux_x86_64_musl" },
  { host = "macos_aarch64", target = "linux_aarch64_musl" },
  { host = "macos_aarch64", target = "linux_riscv64_musl" },
  { host = "macos_aarch64", target = "windows_x86_64_mingw_ucrt" },
  { host = "macos_aarch64", target = "windows_aarch64_mingw_ucrt" },
  { host = "macos_aarch64", target = "macos_aarch64_darwin" },
  { host = "windows_x86_64", target = "linux_x86_64_musl" },
  { host = "windows_x86_64", target = "linux_aarch64_musl" },
  { host = "windows_x86_64", target = "linux_riscv64_musl" },
  { host = "windows_x86_64", target = "windows_x86_64_mingw_ucrt" },
  { host = "windows_x86_64", target = "windows_aarch64_mingw_ucrt" },
  { host = "windows_aarch64", target = "linux_x86_64_musl" },
  { host = "windows_aarch64", target = "linux_aarch64_musl" },
  { host = "windows_aarch64", target = "linux_riscv64_musl" },
  { host = "windows_aarch64", target = "windows_x86_64_mingw_ucrt" },
  { host = "windows_aarch64", target = "windows_aarch64_mingw_ucrt" },
]
